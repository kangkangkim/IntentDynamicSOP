vertical_slice:
  slice_id: mock-confidential-d3a-slice
  status: NOT_READY
  selected_domain: d3a
  selected_lane: lite
  scope:
    user_request_ref: examples/e2e-tr3-d3a/input-tr3.md
    approved_alignment_ref: examples/e2e-tr3-d3a/alignment-pack.yaml
    max_layers: 2
    max_dt_domains: 1

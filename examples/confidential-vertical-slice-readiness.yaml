      repo_path: <ENTERPRISE_REPO_PATH>
      repo_rules_ref: <ENTERPRISE_PLACEHOLDER>
    knowledge:
      layer_knowledge_refs:
        - .claude/skills/idc-workflow/references/knowledge/d3a/layers/TRAN_CFG.md
      dt_knowledge_refs:
        - .claude/skills/idc-workflow/references/knowledge/d3a/dt/TPRINT.md
      architecture_rules_ref: <ENTERPRISE_PLACEHOLDER>
    verification:
      verification_mapping_ref: <ENTERPRISE_PLACEHOLDER>
      dt_build_skill_ref: <ENTERPRISE_DT_BUILD_SKILL_REF>
      tran_build_skill_ref: <ENTERPRISE_TRAN_BUILD_SKILL_REF>
    providers:
      grep:
        status: PLACEHOLDER
        evidence_ref_required: true
      codegraph:
        status: PLACEHOLDER
        evidence_ref_required: true
      okl:
        status: PLACEHOLDER
        evidence_ref_required: true
  readiness_checks:
    - id: layer_knowledge_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: dt_knowledge_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: verification_mapping_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: repo_context_provider_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: dt_red_green_build_skill_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: tran_build_skill_bound
      required: true
      status: FAIL
      evidence_ref: <ENTERPRISE_PLACEHOLDER>
    - id: placeholder_hygiene_preserved
      required: true
      status: PASS
      evidence_ref: tests/test_harness.py::test_placeholder_hygiene

  build_result:
    status: PASS
    stage: tran_build
    command: <ENTERPRISE_TRAN_BUILD_COMMAND>
    errors: []
    evidence:
      - examples/mock-d3a-task/evidence/tran-build-pass.yaml
  completion_status: DONE

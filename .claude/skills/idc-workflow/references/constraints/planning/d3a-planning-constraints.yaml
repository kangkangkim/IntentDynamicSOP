stage: planning
constraints:
  - id: fixed_d3a_layers
    rule: D3A Planner 只能选择 TRAN_CFG、DO、VISP_ADP、TFC_TFI、TFE、ADP、DRV。
  - id: effective_dt_domain_registry
    rule: DT Domain 只能从生效 registry 选择：`.idc/effective-team-config.yaml` 的 `knowledge_catalog.d3a.test_domains`。仓库默认 placeholder 是 TPRINT、FW、DPF；当 `team-config.yaml` 的 `domain.d3a.dt_domains` 非空时整体替换默认 registry（不合并两个来源）；禁止选择生效 registry 之外的 DT Domain。
  - id: no_layer_creation
    rule: D3A Planner 不能创建或删除 D3A Layer。
  - id: no_mapping_guess
    rule: Coding Layer 到 DT Domain 是多对多关系，不能猜真实 mapping。
  - id: one_layer_per_packet
    rule: D3A 多 Layer 必须拆成一个 Layer 一个 Context Packet。
forbidden_actions:
  - 规划 registry 外的 D3A Layer。
  - 规划 registry 外的 DT Domain。
  - 把多个 D3A Layer 合并到同一个 Context Packet。

lanes:
  - id: fast
    file: lanes/fast.yaml
  - id: lite
    file: lanes/lite.yaml
  - id: complex
    file: lanes/complex.yaml

invariants:
  allowed_lane_ids: [fast, lite, complex]
  no_implicit_lane_ids: true
  default_lane: lite
  meaning: Lane only represents execution intensity; domain familiarity belongs to Domain Module routing.

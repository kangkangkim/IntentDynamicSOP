    skill_ref: .claude/skills/idc-gc-third-skill-placeholder/SKILL.md
    capability_keys:
      - <ENTERPRISE_GC_THIRD_SKILL_CAPABILITY>
    allowed_stages: []
    requires:
      - <ENTERPRISE_GC_THIRD_SKILL_NAME>
      - <ENTERPRISE_GC_THIRD_SKILL_CONTRACT_REF>
    blocks_when:
      - missing_original_repo_skill_mapping
    evidence_ref_required: true
    executable: false
    may_override:
      domain_selection: false
      lane_selection: false
      contract_gate: false
      completion_gate: false

rules:
  - Adapter selection is registry-driven, not name-driven.
  - Match by capability_keys, allowed_stages, requires, and blocks_when.
  - If no registry row matches, return NEEDS_ADAPTER_MAPPING.
  - Placeholder adapters must return executable: false.
  - Confidential-only adapters require an explicit team adapter binding ref before execution.
  - Team adapter bindings live outside the shared harness or use placeholder refs in this repository.
  - Team-owned brainstorming should bind to idc-brainstorming when available; otherwise use the shared IDC fallback.
  - Grill Me is provided by idc-intent-grilling from the shared GitHub harness unless a team later adds its own binding.
  - Adapter registry rows cannot grant Domain, Lane, Contract Gate, or Completion Gate ownership.

      - confidential_sop_reuse
      - gc_planning_assistance
      - gc_implementation_assistance
      - gc_debugging_assistance
      - gc_review_assistance
      - gc_verification_assistance
    allowed_stages: [planning, implementation, debugging, review, verification]
    requires:
      - human_alignment_approved
      - selected_domain
      - selected_lane
      - task_contract_ref
      - expected_outputs
      - confidential_gc_mapping_ref
    blocks_when:
      - outside_confidential_zone
      - missing_gc_atom_mapping
      - critical_clarification_missing
    evidence_ref_required: true
    executable: true
    may_override:
      domain_selection: false
      lane_selection: false
      contract_gate: false
      completion_gate: false


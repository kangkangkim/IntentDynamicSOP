skill_adapters:
  - id: idc-brainstorming
    class: team_pre_alignment_adapter
    status: team_bindable
    skill_ref: .claude/skills/idc-brainstorming/SKILL.md
    binding_ref: <TEAM_ADAPTER_BINDING_REF>
    capability_keys:
      - brainstorming
      - raw_idea_discovery
      - divergent_exploration
      - draft_spec_generation
    allowed_stages: [discovery, pre_alignment]
    requires:
      - input_maturity_raw_idea
      - team_adapter_binding_ref_optional
    blocks_when:
      - structured_requirement_ready
      - tr3_contract_sufficient
      - human_alignment_approved
    evidence_ref_required: false
    executable: true
    may_override:
      domain_selection: false
      lane_selection: false
      contract_gate: false
      completion_gate: false

  - id: idc-superpowers-adapter
    class: public_methodology_adapter
    status: active
    skill_ref: .claude/skills/idc-superpowers-adapter/SKILL.md
    capability_keys:
      - execution_discipline
      - planning
      - tdd
      - debugging
      - review
      - verification
    allowed_stages: [planning, implementation, debugging, review, verification]
    requires:
      - human_alignment_approved
      - selected_domain
      - selected_lane
      - required_contracts_present
      - bounded_execution_unit
    blocks_when:
      - critical_clarification_missing
      - human_alignment_not_approved
    evidence_ref_required: true
    executable: true
    may_override:
      domain_selection: false
      lane_selection: false
      contract_gate: false
      completion_gate: false

  - id: idc-gc-sop-adapter

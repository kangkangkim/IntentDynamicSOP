$schema: https://json-schema.org/draft/2020-12/schema
title: IDC Context Load Plan
type: object
required: [context_load_plan]
properties:
  context_load_plan:
    type: object
    additionalProperties: false
    required: [status, source_sha256, phase, signals, alignment_resolution, required_refs, selected_capabilities, knowledge_load_plan_ref, knowledge_plan_id, required_static_knowledge, knowledge_search_scopes, repo_context_plan, load_policy]
    properties:
      status:
        const: READY
      source_sha256:
        type: string
        minLength: 1
      phase:
        enum: [bootstrap, decision, planning, execution, completion, resume]
      domain:
        type: [string, "null"]
        enum: [general, d3a, custom, null]
      lane:
        type: [string, "null"]
        enum: [fast, lite, complex, null]
      signals:
        type: array
        uniqueItems: true
        items:
          type: string
      alignment_resolution:
        type: [object, "null"]
        additionalProperties: false
        required: [signal_set, alignment_check_gate, matched_step_ids, skipped_step_ids, fallback_reason, steps]
        properties:
          signal_set:
            enum: [complete, uncertain]
          alignment_check_gate:
            # complete: pre-alignment signals are resolved and the gate can be
            # evaluated on must_execute steps; uncertain: the gate waits on the
            # open per-step trigger evaluations carried in
            # pending_trigger_evaluations.
            enum: [pre_alignment_signals_resolved, pending_trigger_evaluations]
          matched_step_ids:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
          skipped_step_ids:
            type: array
            uniqueItems: true
            items: {type: string, minLength: 1}
          fallback_reason:
            type: [string, "null"]
          steps:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [step_id, trigger_signals, skill_ref, status]
              properties:
                step_id: {type: string, minLength: 1}
                trigger_signals:
                  type: array
                  uniqueItems: true
                  items: {type: string, minLength: 1}
                skill_ref:
                  # Steps usually bind one Skill; multi-skill steps carry the
                  # resolved refs as an array.
                  type: [string, array]
                  items: {type: string, minLength: 1}
                status:
                  enum: [must_execute, always_run, skipped_by_signal, pending_trigger_evaluation]
          pending_trigger_evaluations:
            # Emitted only when signal_set is uncertain: every signal-guarded
            # (non-alignment_check, non-empty trigger_signals) step whose
            # trigger evaluation is still open under the full-pipeline fallback.
            type: array
            uniqueItems: true
            items:
              type: object
              additionalProperties: false
              required: [step_id, trigger_signals]
              properties:
                step_id: {type: string, minLength: 1}
                trigger_signals:
                  type: array
                  uniqueItems: true
                  items: {type: string, minLength: 1}
      required_refs:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      selected_capabilities:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [capability_id, skill_ref, execution_order]
          properties:
            capability_id: {type: string, minLength: 1}
            skill_ref: {type: string, minLength: 1}
            execution_order: {type: integer, minimum: 1}
      knowledge_load_plan_ref:
        type: [string, "null"]
      knowledge_plan_id:
        type: [string, "null"]
      required_static_knowledge:
        type: array
        items: {type: object}
      knowledge_search_scopes:
        type: array
        items: {type: object}
      repo_context_plan:
        type: [object, "null"]
      load_policy:
        const: read_required_refs_only

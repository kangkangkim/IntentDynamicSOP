schema: skill_adapter
version: 0

description: >
  Non-sensitive contract for external harness skills that wrap enterprise
  original-repository skills or SOP atoms. Adapters declare boundaries; they do
  not copy confidential implementation details.

skill_adapter:
  id: string
  status: active | placeholder | confidential_only | team_bindable
  class: public_methodology_adapter | team_pre_alignment_adapter | enterprise_gc_sop_adapter | original_enterprise_repo_skill_adapter | verification_adapter
  source:
    kind: external_public | enterprise_gc_sop | original_enterprise_repo_skill
    ref: string
  binding_ref: string
  capability_keys: []
  allowed_stages: []
  entry_conditions: []
  forbidden_conditions: []
  input_contract_ref: string
  output_contract_ref: string
  evidence_ref_required: true
  may_override:
    domain_selection: false
    lane_selection: false
    contract_gate: false
    completion_gate: false
  confidential_placeholders:
    - <ENTERPRISE_GC_SOP_REF>
    - <ENTERPRISE_ORIGINAL_REPO_SKILL_REF>
    - <ENTERPRISE_GC_THIRD_SKILL_NAME>
    - <ENTERPRISE_BRAINSTORMING_SKILL_REF>
    - <ENTERPRISE_PLACEHOLDER>

adapter_registry:
  file: .claude/skills/idc-workflow/references/registries/skill-adapters.yaml
  match_inputs:
    - selected_stage
    - requested_capability_keys
    - selected_domain
    - lane_applicability
    - selected_lane_or_execution_profile
    - required_contract_refs
    - confidential_mapping_refs
    - effective_team_config_ref
    - capability_selection_ref
  no_match_result: NEEDS_ADAPTER_MAPPING
  team_binding_source: team-config.yaml
  effective_binding_source: .idc/effective-team-config.yaml

rules:
  - Skill adapters live under `.claude/skills/`.
  - Skill Adapter Router must select adapters from the adapter_registry, not by name guessing.
  - Adapter matching uses capability_keys, allowed_stages, requires, and blocks_when.
  - If no registry row matches, return NEEDS_ADAPTER_MAPPING.
  - Shared registry rows and validated adapter_extensions decide eligibility; team-config bindings decide availability.
  - Capability Selector decides which available skill runs for the current stage and execution unit.
  - Team-bindable adapters may use a company binding when present and must keep a shared fallback contract.
  - Confidential-only adapters must resolve a non-null skill_ref from effective team config before execution.
  - Skill adapters must not contain real enterprise paths, APIs, commands, logs, tests, or implementation facts in the external harness.
  - Skill adapters are called only after IDC routing has selected the workflow stage.
  - Skill adapters cannot choose Domain, Lane, Contract Gate, or Completion Gate.
  - Skill adapters must return bounded summaries and evidence refs, not full logs.

example:
  skill_adapter:
    id: idc-dt-design
    status: confidential_only
    source:
      kind: original_enterprise_repo_skill
      ref: <ENTERPRISE_ORIGINAL_REPO_SKILL_REF>
    binding_ref: team-config.yaml.bindings.dt_design.skill_ref
    capability_keys:
      - dt_design
      - test_design
    allowed_stages:
      - dt_design
      - planning
    entry_conditions:
      - Human Alignment approved.
      - Verification Contract exists.
      - Selected DT domain is known.
    forbidden_conditions:
      - Guessing enterprise DT design rules.
      - Treating DT design as RED/GREEN evidence.
    input_contract_ref: .claude/skills/idc-dt-design/SKILL.md
    output_contract_ref: .claude/skills/idc-dt-design/SKILL.md
    evidence_ref_required: true

verification:
  required_dt_domains: []
  red_evidence: []
  green_evidence: []
  build_required: boolean
  build_result:
    status: NOT_RUN
    stage: string
    command: string
    errors: []
    evidence: []
  completion_status: NOT_STARTED

example:
  verification:
    required_dt_domains: [TPRINT, FW]
    red_evidence:
      - domain: TPRINT
        status: RED
        evidence: examples/mock-d3a-task/evidence/tprint-red.yaml
    green_evidence:
      - domain: TPRINT
        status: GREEN
        evidence: examples/mock-d3a-task/evidence/tprint-green.yaml
      - domain: FW
        status: GREEN
        evidence: examples/mock-d3a-task/evidence/fw-green.yaml
    build_required: true
    build_result:
      status: PASS
      stage: tran_build
      command: <ENTERPRISE_TRAN_BUILD_COMMAND>
      errors: []
      evidence:
        - examples/mock-d3a-task/evidence/tran-build-pass.yaml
    completion_status: DONE

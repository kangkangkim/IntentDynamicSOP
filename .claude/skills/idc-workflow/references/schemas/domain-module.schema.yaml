domain_module:
  id: string
  name: string
  status: active | reserved | template
  route:
    route_id: string
    trigger_rules: []
    fallback: GENERAL_CODING
  registries:
    coding_layers: string
    test_domains: string
  workflow:
    entrypoint: string
    requirement_assessor: string
    planner_schema: string
    tdd_state_machine: string
    completion_gate: string
    required_contracts: []
  knowledge:
    root: string
    loading_policy: progressive
  execution:
    agents: []
    skills: []
  examples: []

rules:
  - Domain Module 只能通过 module.yaml 注册。
  - Core workflow 不得直接写死某个 domain 的内部 layer。
  - Scenario Router 只选择 module，不展开 module 内部实现。
  - Module 内部可以定义自己的 layer registry 和 test domain registry。
  - Module 的 completion gate 必须基于工具证据。
  - Module 里涉及企业信息的内容必须使用 placeholder。

example:
  domain_module:
    id: d3a
    name: D3A Coding
    status: active
    route:
      route_id: D3A_CODING
      trigger_rules:
        - 用户明确选择 D3A。
        - 任务明确属于固定 D3A architecture space。
      fallback: GENERAL_CODING
    registries:
      coding_layers: registries/d3a-layers.yaml
      test_domains: registries/dt-domains.yaml
    workflow:
      entrypoint: workflows/d3a-workflow.md
      requirement_assessor: workflows/requirement-assessor.md
      planner_schema: schemas/d3a-plan.schema.yaml
      tdd_state_machine: workflows/tdd-state-machine.md
      completion_gate: required_dt_green_and_tran_build_pass
      required_contracts:
        - d3a_specification
        - api_contract
        - task_contract
        - verification_contract
    knowledge:
      root: knowledge/d3a
      loading_policy: progressive
    execution:
      agents:
        - agents/d3a-layer-coder.md
        - agents/dt-test-writer.md
        - agents/build-error-analyzer.md
      skills:
        - skills/idc-d3a-coding/SKILL.md
        - skills/idc-dt-build/SKILL.md
        - skills/idc-tran-build/SKILL.md
    examples:
      - examples/mock-d3a-task

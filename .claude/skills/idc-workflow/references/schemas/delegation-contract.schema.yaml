delegation_contract:
  task_id: string
  workflow_id: raw_idea_alignment | tr3_alignment | general_execution | d3a_execution | verification_fix | build_fix
  official_dynamic_workflow:
    required: boolean
    reason: string
    triggers:
      - many_files
      - many_execution_units
      - fanout_collect_verify
      - repeat_until_pass
      - large_migration
      - cross_checked_research
      - background_run_needed
      - save_and_rerun_needed
  workflow_trigger:
    latest_event: new_user_input | normalized_request_ready | human_alignment_approved | domain_or_lane_resolved | agent_result_returned | test_failed | build_failed | fix_failed | scope_changed | completion_gate_blocked
    input_maturity: raw_idea | structured_requirement | tr3_design_doc | approved_alignment
    human_alignment_status: missing | pending | approved
    selected_domain: unknown | general | d3a
    selected_lane: unknown | fast | lite | complex
    current_state: intake | alignment | planning | execution | verification | fix | done | escalated
    failure_kind: none | test | build | tool_evidence_unavailable | repeated_fix_failure
  selection_layer: dynamic_workflow | agent_team | subagent
  selected_agent_team: intent_alignment | knowledge | planning | coding | verification
  selected_agents: []
  main_agent_role: planning_and_delegation_only
  domain_execution_skill_ref: skill_ref
  capability_selection_ref: ref
  selected_atomic_skill_refs: []
  knowledge_load_plan_ref: ref
  knowledge_plan_id: sha256
  execution_authorization_request_ref: ref
  delegation_reason: string
  selection_reason:
    workflow_reason: string
    trigger_event: string
    entry_condition_matched: string
    allowed_next_states: []
    agent_team_reason: string
    subagent_reason: string
  subagent_communication:
    required: boolean
    reason: string
    handoff_edges:
      - from: string
        to: string
        artifact: string
  approved_alignment_ref: string
  context_packet_ref: string
  run_state_ref: string
  execution_unit_ref: string
  allowed_paths: []
  forbidden_paths: []
  required_inputs:
    - approved_contract
    - execution_unit
    - context_packet
    - verification_contract
  expected_return:
    - status
    - summary
    - changed_paths
    - evidence_refs
    - knowledge_consumption_receipt
    - blockers
    - context_to_keep
    - context_to_drop
  forbidden_return:
    - full_subagent_session
    - full_logs
    - full_search_results
    - unbounded_repo_context
  completion_authority: main_agent_only

agent_result:
  status: done | blocked | failed | split_required
  summary: string
  changed_paths: []
  evidence_refs: []
  blockers: []
  context_to_keep: []
  context_to_drop: []
  next_recommendation: none | replan | escalate | delegate_followup
  execution_receipt:
    authorization_id: sha256
    dispatch_tool_call_ref: ref
    executor_session_ref: ref
    executor_kind: subagent | agent_team | official_dynamic_workflow
    loaded_domain_execution_skill_ref: skill_ref
    executed_atomic_skill_refs: []
    knowledge_plan_id: sha256
    knowledge_consumption_result_ref: ref

rules:
  - Main agent role 必须是 planning_and_delegation_only。
  - Main agent 必须先选 IDC workflow route，再判断是否升级 official dynamic workflow，再选 agent_team，最后决定 subagent。
  - IDC Workflow Router 是事件触发的状态路由。
  - Official Dynamic Workflow 只在大规模、脚本化、可复跑的 fan-out 编排时使用。
  - Workflow Router 必须记录 trigger_event 和 entry_condition_matched。
  - Agent Team 只在多个 subagent 需要交流、交接或共享中间结果时使用。
  - Subagent 用于隔离执行一个 execution unit / Layer Context Packet / failure analysis。
  - Main agent 不能直接执行任何 repository mutation，包括 Fast、Lite、Complex 的代码、测试、构建文件、验证产物和 targeted fix。
  - General execution 的 domain_execution_skill_ref 必须是 idc-general-coding；GC adapters 只能出现在 selected_atomic_skill_refs。
  - Agent Result 必须携带 execution_receipt，并绑定 authorization、真实 dispatch tool call 和 executor session。
  - Delegation、Authorization、Context Packet 和 Execution Receipt 必须绑定同一个 knowledge_plan_id。
  - Completion 前 Knowledge Consumption Result 必须 VERIFIED。
  - Main agent 不能把完整 subagent session 合并回 main session。
  - Delegation Contract 必须记录 run_state_ref，便于中断后恢复。
  - Resume 必须通过 runtime_state checkpoint 恢复，不能依赖 main agent 记忆。
  - Subagent 只能接收当前 Delegation Contract 授权的 Context Packet。
  - Subagent 返回必须包含 context_to_keep / context_to_drop。
  - Subagent 返回禁止包含 full_logs / full_search_results / full_subagent_session。
  - DONE 判断只能由 main agent 基于 workflow gates 和工具 evidence 完成。
  - Provider finding 不能替代 tool evidence。
  - 单个 execution unit 代码变更必须 <= 500 LOC。
  - `allowed_paths` 必须覆盖 selected_atomic_skill_refs 声明的 artifact
    destination（expected_outputs 路径）；冲突时 BLOCKED 并显式 widen 授权或
    re-plan，不得执行期改写产物落点。

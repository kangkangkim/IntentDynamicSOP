schema: effective_team_config
version: 1

# Version 2 effective runtimes retain validated team bindings, adapter
# extensions, explicit alignment, and complete capability metadata. Pack Lane
# profiles provide defaults only for Lane IDs not explicitly configured by the
# team. registration_audit.declared_overrides records binding replacements.

effective_team_config:
  generated: true
  source_ref: team-config.yaml
  source_sha256: sha256
  runtime_dependency_sha256: sha256 # v2 consumed file-byte manifest digest
  runtime_dependency_files: {} # absolute reference to content SHA-256
  config_version: 1 | 2
  team: {}
  domain:
    id: string
    source: builtin | team-config-inline
    lane_applicability: applicable | not_applicable | null
    execution_profile: lane_driven | d3a_fixed_workflow | null
  domains: # emitted when team-config declares domain.enabled
    enabled: [general, d3a, custom]
    default: general | d3a | custom
    modules:
      domain_key:
        available_capabilities: # never unioned with another Domain during selection
          - id: string
            skill_ref: skill_ref
            execution_role: atomic_capability | verification_capability | pre_alignment_capability | null
            capability_keys: []
            allowed_stages: []
            eligible_lanes: []
            execution_profiles: []
            trigger_signals: []
            evidence_required: boolean | null
            requires: []
            blocks_when: []
            composes_with: []
            supersedes: []
        lane_profiles: {}
        required_contracts: []
        workflow_skill_ref: skill_ref | null
        planner_skill_ref: skill_ref | null
        completion_skill_ref: skill_ref | null
  bindings: {}
  adapter_extensions: []
  available_capabilities: []
  knowledge_catalog:
    d3a:
      layers: []
      test_domains: []
    general:
      components: []
      test_domains: []
    custom:
      layers: []
      test_domains: []
  registration_audit:
    status: PASS | FAIL
    conflicts: []
    declared_overrides: []
  knowledge: {}
  lane:
    default: fast | lite | complex
    profiles: {}
  # alignment is materialized with the shape defined by the top-level
  # alignment section below.
  capability_selection: {}
  self_optimization: {}
  readiness:
    status: READY | INVALID
    errors: []
    warnings: []

# Shape of the materialized pre-alignment pipeline. The Resolver emits it as
# the alignment section of effective_team_config, including the framework
# default chain fallback when team-config.yaml has no alignment section.
alignment:
  source: configured | framework-default
  bindings:
    capability_name:
      skill_ref: skill_ref
  orchestration:
    mode: ordered
    steps:
      - id: string
        stage: discovery | divergence | clarification | alignment_check
        skill_ids: []
        trigger_signals: []

rules:
  - This file is generated and must never be edited manually.
  - Runtime routing reads this file after team-config validation.
  - Multi-domain routing selects exactly one module from domains.enabled per task; domain remains the default module for compatibility.
  - This file is checkpoint state, not completion evidence.
  - v2 runtime dependency identity includes consumed Pack, policy, registry, and Skill file bytes.
  - Selector and graph compiler reject a stale dependency identity.

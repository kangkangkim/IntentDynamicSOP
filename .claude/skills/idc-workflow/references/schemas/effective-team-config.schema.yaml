schema: effective_team_config
version: 1

effective_team_config:
  generated: true
  source_ref: team-config.yaml
  source_sha256: sha256
  config_version: 1
  team: {}
  domain:
    id: string
    source: builtin | team-config-inline
    lane_applicability: applicable | not_applicable | null
    execution_profile: lane_driven | d3a_fixed_workflow | null
  bindings: {}
  adapter_extensions: []
  available_capabilities: []
  knowledge_catalog:
    d3a:
      layers: []
      test_domains: []
    general:
      components: []
      test_domains: []
    custom:
      layers: []
      test_domains: []
  registration_audit:
    status: PASS | FAIL
    conflicts: []
    declared_overrides: []
  knowledge: {}
  lane:
    default: fast | lite | complex
    profiles: {}
  # alignment is materialized with the shape defined by the top-level
  # alignment section below.
  capability_selection: {}
  self_optimization: {}
  readiness:
    status: READY | INVALID
    errors: []
    warnings: []

# Shape of the materialized pre-alignment pipeline. The Resolver emits it as
# the alignment section of effective_team_config, including the framework
# default chain fallback when team-config.yaml has no alignment section.
alignment:
  source: configured | framework-default
  bindings:
    capability_name:
      skill_ref: skill_ref
  orchestration:
    mode: ordered
    steps:
      - id: string
        stage: discovery | divergence | clarification | alignment_check
        skill_ids: []
        trigger_signals: []

rules:
  - This file is generated and must never be edited manually.
  - Runtime routing reads this file after team-config validation.
  - This file is checkpoint state, not completion evidence.

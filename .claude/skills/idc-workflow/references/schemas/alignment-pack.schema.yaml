alignment_pack:
  input_understanding:
    input_type: natural_language_intent | tr3_design_doc
    goal: string
    extracted_requirement: string
    extracted_dt_design: string
    open_questions: []
  classification:
    selected_domain: string
    lane_applicability: applicable | not_applicable
    selected_lane: fast | lite | complex | null
    execution_profile: lane_driven | d3a_fixed_workflow | string
    change_type: string
    change_shape: string
    reasons: []
  contract_set:
    required_contracts: []
    optional_contracts: []
    reasons: []
  scope_boundary:
    in_scope: []
    out_of_scope: []
    forbidden_changes: []
  completion_gate:
    lane_completion_requirements: []
    domain_completion_requirements: []
    evidence_required: []
  escalation_policy:
    triggers: []

human_alignment:
  required: true
  status: pending | approved | needs_clarification | rejected
  reviewer_decision: approve | request_clarification | request_reclassify | reject
  notes: []

rules:
  - D3A 使用 lane_applicability=not_applicable、selected_lane=null 和 execution_profile=d3a_fixed_workflow。
  - General Coding 与其他 dynamic-lane route 使用 lane_applicability=applicable，并由 Lane Resolver 选择 Lane。
  - Human Alignment 发生在 Planner 之前。
  - Human Alignment 只确认方向、边界、contract set 和 completion gate。
  - Human Alignment 通过后，默认进入 Automated Closure Loop。
  - 后续流程默认不再人工卡点。
  - 只有命中 Escalation Policy 才回到 Human Alignment。

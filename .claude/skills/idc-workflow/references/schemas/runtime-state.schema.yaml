schema: runtime_state
version: 1

description: >
  Machine-readable checkpoint for resuming an IDC workflow after team-config onboarding
  interruption. This file is state, not evidence; DONE still requires tool evidence.

runtime_state:
  run_id: string
  task_id: string
  created_at: string
  updated_at: string
  current_state: intake | discovery | clarification | alignment | planning | execution | verification | fix | done | escalated
  latest_event: new_user_input | normalized_request_ready | human_alignment_approved | agent_result_returned | test_failed | build_failed | fix_failed | scope_changed | completion_gate_blocked | interrupted | resumed
  resume_token: string
  resume_from:
    state: intake | discovery | clarification | alignment | planning | execution | verification | fix | done | escalated
    checkpoint_ref: string
    reason: string

workflow_snapshot:
  input_maturity: raw_idea | structured_requirement | tr3_design_doc | approved_alignment
  selected_domain: unknown | general | d3a
  lane_applicability: unknown | applicable | not_applicable
  selected_lane: null | fast | lite | complex
  execution_profile: unknown | lane_driven | d3a_fixed_workflow
  workflow_id: raw_idea_alignment | tr3_alignment | general_execution | d3a_execution | verification_fix | build_fix | escalation_required
  human_alignment_status: missing | pending | approved
  approved_alignment_ref: string
  delegation_contract_ref: string
  execution_authorization_ref: string
  dispatch_tool_call_ref: string
  executor_session_ref: string
  context_packet_ref: string
  execution_unit_refs: []

progress:
  completed_steps:
    - step_id: string
      summary: string
      artifact_refs: []
      evidence_refs: []
  in_progress_step:
    step_id: string
    owner: main_agent | agent_team | subagent | official_dynamic_workflow
    repository_mutation: boolean
    started_at: string
    expected_outputs: []
  pending_steps:
    - step_id: string
      reason: string

evidence_ledger:
  red_refs: []
  green_refs: []
  build_refs: []
  completion_summary_ref: string

failure_state:
  failure_kind: none | test | build | tool_evidence_unavailable | repeated_fix_failure
  last_failure_ref: string
  retry_count: integer

resume_rules:
  - Runtime state is not DONE evidence.
  - Resume must reload approved_alignment_ref before execution continues.
  - Resume must reload delegation_contract_ref and context_packet_ref before dispatching subagents.
  - Resume must re-run verification if execution may have partially completed before interruption.
  - If scope or contract changed during resume, return to Alignment View.
  - If checkpoint refs are missing or inconsistent, escalate instead of guessing.
  - Do not use main agent conversation memory as the source of truth.
  - If repository_mutation is true, owner cannot be main_agent and execution_authorization_ref, dispatch_tool_call_ref, and executor_session_ref are required.

domain_module:
  id: d3a
  name: D3A Coding
  status: active
  route:
    route_id: D3A_CODING
    trigger_rules:
      - 用户明确选择 D3A。
      - 任务明确属于固定 D3A architecture space。
    fallback: GENERAL_CODING
  lane_policy:
    mode: not_applicable
    selected_lane: null
    bypass_lane_resolver: true
    execution_profile: d3a_fixed_workflow
    reason: D3A uses the harness-fixed workflow instead of Lane classification.
  pre_alignment:
    domain_hint_does_not_imply_readiness: true
    raw_idea_route:
      - skills/idc-intent-discovery/SKILL.md
      - skills/idc-brainstorming/SKILL.md
      - skills/idc-intent-grilling/SKILL.md
    critical_gap_route:
      - skills/idc-intent-grilling/SKILL.md
    questions_via: AskUserTool
    execution_requires_human_alignment: approved
  registries:
    coding_layers: registries/d3a-layers.yaml
    # test_domains is the repo default; a non-empty team-config.yaml
    # domain.d3a.dt_domains replaces it wholesale (never merge).
    test_domains: registries/dt-domains.yaml
  workflow:
    entrypoint: workflows/d3a-workflow.md
    requirement_assessor: workflows/requirement-assessor.md
    planner_schema: schemas/d3a-plan.schema.yaml
    tdd_state_machine: workflows/tdd-state-machine.md
    completion_gate: required_dt_green_and_tran_build_pass
    required_contracts:
      - d3a_specification
      - api_contract
      - task_contract
      - verification_contract
  knowledge:
    root: knowledge/d3a
    loading_policy: progressive
  execution:
    agents:
      - agents/d3a-layer-coder.md
      - agents/dt-test-writer.md
      - agents/build-error-analyzer.md
    skills:
      - skills/idc-d3a-coding/SKILL.md
      - skills/idc-dt-build/SKILL.md
      - skills/idc-tran-build/SKILL.md
  examples:
    - examples/mock-d3a-task

delegation_contract:
  task_id: string
  workflow_id: raw_idea_alignment | tr3_alignment | general_execution | d3a_execution | verification_fix | build_fix
  selection_layer: dynamic_workflow | agent_team | subagent
  selected_agent_team: intent_alignment | knowledge | planning | coding | verification
  selected_agents: []
  main_agent_role: planning_and_delegation_only
  delegation_reason: string
  selection_reason:
    workflow_reason: string
    agent_team_reason: string
    subagent_reason: string
  subagent_communication:
    required: boolean
    reason: string
    handoff_edges:
      - from: string
        to: string
        artifact: string
  approved_alignment_ref: string
  context_packet_ref: string
  execution_unit_ref: string
  allowed_paths: []
  forbidden_paths: []
  required_inputs:
    - approved_contract
    - execution_unit
    - context_packet
    - verification_contract
  expected_return:
    - status
    - summary
    - changed_paths
    - evidence_refs
    - blockers
    - context_to_keep
    - context_to_drop
  forbidden_return:
    - full_subagent_session
    - full_logs
    - full_search_results
    - unbounded_repo_context
  completion_authority: main_agent_only

agent_result:
  status: done | blocked | failed | split_required
  summary: string
  changed_paths: []
  evidence_refs: []
  blockers: []
  context_to_keep: []
  context_to_drop: []
  next_recommendation: none | replan | escalate | delegate_followup

rules:
  - Main agent role 必须是 planning_and_delegation_only。
  - Main agent 必须先选 dynamic_workflow，再选 agent_team，最后决定 subagent。
  - Dynamic Workflow 用于选择生命周期流程，不直接执行任务。
  - Agent Team 只在多个 subagent 需要交流、交接或共享中间结果时使用。
  - Subagent 用于隔离执行一个 execution unit / Layer Context Packet / failure analysis。
  - Main agent 不能直接执行复杂实现。
  - Main agent 不能把完整 subagent session 合并回 main session。
  - Subagent 只能接收当前 Delegation Contract 授权的 Context Packet。
  - Subagent 返回必须包含 context_to_keep / context_to_drop。
  - Subagent 返回禁止包含 full_logs / full_search_results / full_subagent_session。
  - DONE 判断只能由 main agent 基于 workflow gates 和工具 evidence 完成。
  - Provider finding 不能替代 tool evidence。
  - 单个 execution unit 代码变更必须 <= 500 LOC。
